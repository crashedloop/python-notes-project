{% extends 'notes/base.html' %}
{% block title %}Logged Out{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 p-8 text-center">
      <!-- Success Icon -->
      <div class="inline-flex items-center justify-center w-20 h-20 bg-green-100 dark:bg-green-900/30 rounded-full mb-6">
        <svg class="w-12 h-12 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>

      <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-3">
        Successfully Logged Out
      </h2>
      
      <p class="text-gray-600 dark:text-gray-400 mb-8">
        Thanks for using Keep Notes. Your session has been securely ended.
      </p>

      <div class="space-y-3">
        <a 
          href="{% url 'login' %}" 
          class="block w-full px-6 py-3 bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg font-medium shadow-md hover:shadow-lg transition-all duration-200">
          Login Again
        </a>
        
        <a 
          href="{% url 'signup' %}" 
          class="block w-full px-6 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg font-medium transition-colors">
          Create New Account
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
