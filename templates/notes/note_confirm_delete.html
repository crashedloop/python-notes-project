{% extends 'notes/base.html' %}
{% block title %}Delete Note{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 p-8 text-center">
      <!-- Warning Icon -->
      <div class="inline-flex items-center justify-center w-20 h-20 bg-red-100 dark:bg-red-900/30 rounded-full mb-6">
        <svg class="w-12 h-12 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>

      <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">
        Confirm Delete
      </h3>
      
      <p class="text-gray-700 dark:text-gray-300 mb-2">
        Are you sure you want to delete <strong class="font-semibold">{{ note.title }}</strong>?
      </p>
      
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">
        The note will be moved to the recycle bin and can be restored later.
      </p>

      <form method="post" class="space-y-3">
        {% csrf_token %}
        <button 
          type="submit" 
          class="w-full px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium shadow-md hover:shadow-lg transition-all duration-200">
          <svg class="w-5 h-5 inline-block mr-1 -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          Yes, Delete Note
        </button>
        
        <a 
          href="{% url 'notes:note_list' %}" 
          class="block w-full px-6 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg font-medium transition-colors">
          Cancel
        </a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
